name: CI/CD - Build & Deploy to Branch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Syntax & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Solo activa la caché si package-lock.json está presente en el repositorio
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "⚠️ package-lock.json no encontrado en el repo. Ejecutando npm install..."
            npm install
          fi

      - name: Check Astro syntax & types
        run: npm run check

  build-and-deploy:
    name: Build & Publish to deploy branch
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "⚠️ package-lock.json no encontrado en el repo. Ejecutando npm install..."
            npm install
          fi

      - name: Build static site (dist/)
        run: npm run build
        env:
          NODE_ENV: production
          ASTRO_SITE_URL: https://dap.gal

      # Publica la carpeta dist/ en la rama "deploy"
      # Cloudflare Pages estará escuchando la rama "deploy" con build command vacío
      - name: Deploy to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: build ${{ github.sha }} [skip ci]'
