name: Build and publish static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read Hugo version
        id: hugo
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < .hugo-version)"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid Hugo version: $version"
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Verify Hugo
        run: |
          set -euo pipefail
          hugo version
          hugo env

      - name: Setup Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Validate repository
        run: |
          set -euo pipefail
          git diff --check

      - name: Build
        run: |
          set -euo pipefail

          rm -rf public resources

          hugo \
            --environment production \
            --gc \
            --minify \
            --panicOnWarning \
            --printPathWarnings \
            --destination public

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail

          [[ -d public ]] || {
            echo "::error::public directory was not generated"
            exit 1
          }

          [[ -f public/es/index.html ]] || {
            echo "::error::Spanish site was not generated: public/es/index.html"
            exit 1
          }

          [[ -f public/en/index.html ]] || {
            echo "::error::English site was not generated: public/en/index.html"
            exit 1
          }

          files="$(find public -type f | wc -l)"

          [[ "$files" -gt 0 ]] || {
            echo "::error::Generated site is empty"
            exit 1
          }

          grep -q '<html' public/es/index.html
          grep -q '<html' public/en/index.html

          echo "Generated files: $files"

      - name: Check generated site for secrets
        run: |
          set -euo pipefail

          if grep -RInE \
            '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}' \
            public; then
            echo "::error::Potential secret detected in generated site"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public/
          if-no-files-found: error
          retention-days: 7

      - name: Publish site branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd public

          git init
          git checkout -b site

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          git commit \
            -m "build: publish site from ${GITHUB_SHA}" \
            -m "Source commit: ${GITHUB_SHA}"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin site

